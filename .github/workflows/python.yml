name: Python / Boto3

on:
  push:
    paths:
      - "python/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/python.yml"
  pull_request:
    paths:
      - "python/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/python.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install -e "python[dev]"
      - run: npx awesome-emulator run --telemetry off -- python -m pytest -q python/tests
