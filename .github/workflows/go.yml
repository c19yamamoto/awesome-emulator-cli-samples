name: Go v2

on:
  push:
    paths:
      - "go/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/go.yml"
  pull_request:
    paths:
      - "go/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/go.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-go@v7.1.0
        with:
          go-version-file: go/go.mod
      - run: npm ci
      - run: npx awesome-emulator run --telemetry off -- go -C go test ./...
