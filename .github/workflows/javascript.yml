name: JavaScript v3

on:
  push:
    paths:
      - "javascript/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/javascript.yml"
  pull_request:
    paths:
      - "javascript/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/javascript.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm ci --prefix javascript
      - run: npx awesome-emulator run --telemetry off -- node --test javascript/s3-store.test.js
