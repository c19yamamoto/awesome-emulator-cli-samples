name: Java 2.x

on:
  push:
    paths:
      - "java/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/java.yml"
  pull_request:
    paths:
      - "java/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/java.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: java/pom.xml
      - run: npm ci
      # The CLI truststore is for AWS Emulator; resolve Maven artifacts before enabling it.
      - run: mvn -B -f java/pom.xml -DskipTests test
      - run: npx awesome-emulator run --telemetry off --sdk java-v2 -- mvn -o -B -f java/pom.xml test
