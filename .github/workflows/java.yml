name: Java 2.x

on:
  push:
    paths:
      - "java/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/java.yml"
  pull_request:
    paths:
      - "java/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/java.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: 22
      - uses: actions/setup-java@v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: java/pom.xml
      - run: npm ci
      - run: npx awesome-emulator run --telemetry off --sdk java-v2 -- mvn -B -f java/pom.xml test
