version: 2

updates:
  - package-ecosystem: npm
    directories:
      - "/"
      - "/javascript"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "10:00"
      timezone: "Asia/Tokyo"
    groups:
      all-dependencies:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: "/python"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "10:00"
      timezone: "Asia/Tokyo"
    groups:
      all-dependencies:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: "/go"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "10:00"
      timezone: "Asia/Tokyo"
    groups:
      all-dependencies:
        patterns:
          - "*"

  - package-ecosystem: maven
    directory: "/java"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "10:00"
      timezone: "Asia/Tokyo"
    groups:
      all-dependencies:
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: "/rust"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "10:00"
      timezone: "Asia/Tokyo"
    groups:
      all-dependencies:
        patterns:
          - "*"

  - package-ecosystem: nuget
    directories:
      - "/dotnet/src/Sample"
      - "/dotnet/tests/Sample.Tests"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "10:00"
      timezone: "Asia/Tokyo"
    groups:
      all-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "10:00"
      timezone: "Asia/Tokyo"
    groups:
      all-dependencies:
        patterns:
          - "*"
