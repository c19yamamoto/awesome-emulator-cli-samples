[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "emulator-sample"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["boto3==1.36.26"]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[tool.setuptools.packages.find]
where = ["src"]
